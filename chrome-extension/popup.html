<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dota Web Sync</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>DOTA WEB SYNC</h1>
    <span id="statusBadge">WAITING</span>
  </header>
  <p id="statusText">เปิดแอป Dota Combo Board แล้วใส่รหัสจับคู่</p>
  <label for="pairingCode">PAIRING CODE</label>
  <div class="row">
    <input id="pairingCode" inputmode="numeric" maxlength="6" placeholder="000000">
    <button id="connectButton">CONNECT</button>
  </div>
  <dl>
    <div><dt>APP</dt><dd id="appVersion">—</dd></div>
    <div><dt>LAST QUERY</dt><dd id="lastQuery">—</dd></div>
    <div><dt>RESULTS</dt><dd id="resultCount">0</dd></div>
  </dl>
  <button id="reconnectButton" class="secondary">RECONNECT</button>
  <p class="note">ค้นเว็บสาธารณะผ่าน Bing RSS เท่านั้น ไม่อ่าน cookie และไม่ควบคุม ChatGPT</p>
  <script src="popup.js"></script>
</body>
</html>
